name: verification

on:
  push:
  pull_request:

jobs:
  analytic-and-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned analytic environment
        run: python -m pip install -r requirements-lock.txt
      - name: Verify archived file hashes
        run: sha256sum -c MANIFEST.sha256
      - name: Run analytic suites
        run: python tests/run_verification.py
      - name: Check stored-data claims
        run: python tests/check_claims.py
      - name: Rebuild selected analytic profile
        run: python data/analytic/build_profile.py
      - name: Rebuild strip-only ESI table
        run: python analysis/profile_mode_audit.py --write
      - name: Rebuild five paper figures from tracked strip inputs
        run: python figures/make_figures.py
      - name: Verify regenerated artifacts are unchanged
        run: sha256sum -c MANIFEST.sha256
